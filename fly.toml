# Fly.io: one always-on machine, a public HTTPS URL for the ParaDev sign-in callback,
# and a volume for the encrypted account store. See README > Deploying.
app = "paradev-slack"
primary_region = "yyz"

[build]

[env]
  PORT = "3000"
  STORE_PATH = "/data/store.json"

[mounts]
  source = "paradev_slack_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: Slack needs answers within 3 seconds, and Socket Mode needs a live connection.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
