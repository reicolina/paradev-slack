# Slack app manifest for Socket Mode (no public URL needed).
# Create the app at https://api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: ParaDev
  description: Send a Slack message to a ParaDev workspace and put an AI agent on it.
  background_color: "#1f1b2e"
features:
  bot_user:
    display_name: ParaDev
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  shortcuts:
    - name: Send to ParaDev
      type: message
      callback_id: send_to_paradev
      description: Send this message to a ParaDev workspace
oauth_config:
  scopes:
    bot:
      - commands   # the message shortcut
      - chat:write # DM you the result
      - users:read # author names in the prompt
      - im:write   # open your DM to recall your last choice
      - im:history # read that choice back from the DM
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
